<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeeragogyBot - AI-Powered Handbook Assistant</title>
    <meta name="description" content="Interactive AI assistant for the Peeragogy Handbook V3">
    <!-- Enhanced Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src https://flowise.pyragogy.org ; img-src 'self' https://raw.githubusercontent.com data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; frame-src 'none'; object-src 'none'; base-uri 'self';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /**
         * CSS Variables and Base Styles
         * ------------------------------- */
        :root {
            /* Color palette */
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --secondary-gradient: linear-gradient(135deg, #10b981, #059669);
            --coffee-gradient: linear-gradient(135deg, #f59e0b, #d97706);

            /* Light theme */
            --background-light: #f9fafb;
            --text-light: #111827;
            --glass-bg-light: rgba(255, 255, 255, 0.6);
            --glass-border-light: rgba(0, 0, 0, 0.1);

            /* Dark theme */
            --background-dark: #111827;
            --text-dark: #f9fafb;
            --glass-bg-dark: rgba(31, 41, 55, 0.6);
            --glass-border-dark: rgba(255, 255, 255, 0.1);

            /* Default to light theme */
            --background: var(--background-light);
            --text: var(--text-light);
            --glass-bg: var(--glass-bg-light);
            --glass-border: var(--glass-border-light);

            /* Spacing and sizing */
            --header-height: 64px;
            --footer-height: 50px;
            --border-radius: 1rem;
            --button-radius: 0.5rem;
            --icon-size: 36px;
            --transition-speed: 0.3s;
        }

        /* Dark theme class */
        body.dark {
            --background: var(--background-dark);
            --text: var(--text-dark);
            --glass-bg: var(--glass-bg-dark);
            --glass-border: var(--glass-border-dark);
        }

        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--background);
            color: var(--text);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            flex-direction: column;
        }

        /* Fallbacks for browsers that don't support CSS variables */
        @supports not (--custom: property) {
            body {
                background-color: #f9fafb;
                color: #111827;
            }

            body.dark {
                background-color: #111827;
                color: #f9fafb;
            }
        }

        /**
         * Component Styles
         * --------------- */
        /* Glass panel effect with fallbacks */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            /* Fallback */
            background: var(--glass-bg);
            border: 1px solid rgba(0, 0, 0, 0.1);
            /* Fallback */
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        @supports (backdrop-filter: blur(12px)) {
            .glass-panel {
                backdrop-filter: blur(12px);
            }
        }

        @supports (-webkit-backdrop-filter: blur(12px)) {
            .glass-panel {
                -webkit-backdrop-filter: blur(12px);
            }
        }

        body.dark .glass-panel {
            background: rgba(31, 41, 55, 0.8);
            /* Fallback */
            border-color: rgba(255, 255, 255, 0.1);
            /* Fallback */
        }

        /* Header styles */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            z-index: 95;
            width: 100%;
            box-sizing: border-box;
            height: var(--header-height);
        }

        @supports (backdrop-filter: blur(12px)) {
            .app-header {
                backdrop-filter: blur(12px);
            }
        }

        @supports (-webkit-backdrop-filter: blur(12px)) {
            .app-header {
                -webkit-backdrop-filter: blur(12px);
            }
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
        }

        .header-logo svg {
            width: 32px;
            height: 32px;
        }

        .header-logo h2 {
            font-size: 1.25rem;
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--primary);
            /* Fallback */
        }

        /* Loading states for logo */
        .header-logo.loading::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .header-logo.error svg {
            border: 2px solid #ef4444;
        }

        .logo-error {
            color: #ef4444;
            font-size: 0.75rem;
            position: absolute;
            bottom: -1.25rem;
            left: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-toggle {
            padding: 0.5rem;
            border-radius: 50%;
            border: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .theme-toggle:hover {
            opacity: 0.8;
        }

        .theme-toggle:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Main content area */
        main {
            flex-grow: 1;
            display: flex;
            width: 100%;
        }

        /* Welcome screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            width: 100%;
            margin: auto;
            max-width: 800px;
            box-sizing: border-box;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .logo-container {
            width: 396px;
            /* Corrected width */
            height: 96px;
            /* background gradient removed as image provides visuals */
            border-radius: 50%;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            overflow: hidden;
        }

        .logo-container img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--primary);
            /* Fallback */
        }

        .subtitle {
            font-size: 1.125rem;
            margin-bottom: 2rem;
            max-width: 600px;
            opacity: 0.8;
        }

        .cta-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--button-radius);
            background: var(--primary-gradient);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity var(--transition-speed);
        }

        .cta-button:hover {
            opacity: 0.9;
        }

        .cta-button:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Chatbot container */
        #chatbot-container {
            display: none;
            flex-grow: 1;
            padding: 1rem;
            margin: 1rem;
            box-sizing: border-box;
            overflow: hidden;
            height: calc(100vh - 2rem - var(--footer-height) - var(--header-height));
            position: relative;
        }

        #chatbot-container.visible {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Loading indicator */
        .loading-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            z-index: 10;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Custom chat message icons */
        .bot-icon,
        .user-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bot-icon {
            background: var(--primary-gradient);
        }

        .user-icon {
            background: var(--secondary-gradient);
        }

        /* Custom styling for Flowise messages */
        .message-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .message-icon {
            flex-shrink: 0;
            margin-right: 8px;
        }

        .message-content {
            flex-grow: 1;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
        }

        /* Coffee button */
        .coffee-button {
            position: fixed;
            bottom: calc(var(--footer-height) + 1rem);
            right: 1rem;
            padding: 0.75rem;
            text-align: center;
            z-index: 90;
            max-width: 200px;
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        .coffee-button:hover {
            opacity: 1;
        }

        /* Removed conflicting rule, keeping only display: none */
                /* Regola per mostrare il messaggio del coffee button */
        .coffee-button .message {
           display: block; /* Modifica da none a block */
           margin-bottom: 0.5rem; /* Aggiungi spazio sotto il messaggio */
           font-size: 0.875rem; /* Imposta dimensione font */
           opacity: 0.8; /* Leggera trasparenza */
           color: var(--text); /* Usa il colore del testo del tema */
        }

        .coffee-button .button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--coffee-gradient);
            color: white;
            text-decoration: none;
            border-radius: var(--button-radius);
            font-weight: 600;
            font-size: 0.85rem;
            transition: opacity var(--transition-speed);
            white-space: nowrap;
        }

        .coffee-close {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.8;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .coffee-close:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Footer */
        footer {
            padding: 1rem;
            background: var(--glass-bg);
            border-top: 1px solid var(--glass-border);
            z-index: 95;
            width: 100%;
            box-sizing: border-box;
            margin-top: auto;
            height: var(--footer-height);
        }

        @supports (backdrop-filter: blur(12px)) {
            footer {
                backdrop-filter: blur(12px);
            }
        }

        @supports (-webkit-backdrop-filter: blur(12px)) {
            footer {
                -webkit-backdrop-filter: blur(12px);
            }
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }

        .footer-content a {
            color: inherit;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity var(--transition-speed);
        }

        .footer-content a:hover {
            opacity: 1;
        }

        /* GitHub icon styling */
        .github-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .github-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--text);
            transition: opacity var(--transition-speed);
        }

        .github-icon:hover svg {
            opacity: 1;
        }

        /* Reset button */


        /* System log */
        .system-log {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text);
            opacity: 0.7;
            margin-top: 1rem;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.75rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--button-radius);
            color: var(--text);
            font-size: 0.875rem;
            z-index: 100;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s;
            max-width: 300px;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }

        .toast.info {
            border-left: 4px solid var(--primary);
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .footer-content {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
                align-items: center;
            }

            #chatbot-container {
                height: calc(100vh - 2rem - 70px - var(--header-height));
                margin: 0.5rem;
                padding: 0.5rem;
            }

            footer {
                height: auto;
                padding: 0.75rem;
            }

            .github-icon {
                margin: 0 auto;
            }

            .github-icon svg {
                width: 28px;
                height: 28px;
            }

            .app-header {
                padding: 0.75rem;
            }

            .header-logo h2 {
                font-size: 1rem;
            }

            .header-logo svg {
                width: 28px;
                height: 28px;
            }

            .coffee-button,
            .reset-button {
                bottom: calc(70px + 0.5rem);
            }

            .coffee-button {
                right: 0.5rem;
                padding: 0.75rem;
            }

            .reset-button {
                left: 0.5rem;
                padding: 0.5rem 0.75rem;
            }

            .toast {
                top: auto;
                bottom: calc(70px + 0.5rem);
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                right: auto;
                width: 90%;
            }

            .toast.visible {
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Accessibility improvements */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Focus styles for keyboard navigation */
        a:focus,
        button:focus,
        input:focus,
        textarea:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* High contrast mode adjustments */
        @media (forced-colors: active) {

            .glass-panel,
            .app-header,
            footer {
                border: 1px solid CanvasText;
            }

            .bot-icon,
            .user-icon {
                border: 1px solid CanvasText;
            }
        }
    </style>
</head>

    <script>
        /**
         * PeeragogyBot Application
         * ------------------------
         * A single-page chatbot interface for the Peeragogy Handbook
         */

        // Utility functions
        const Utils = {
            // Check for passive event listener support
            supportsPassiveEvents: (() => {
                let passive = false;
                try {
                    const options = {
                        get passive() { passive = true; return passive; }
                    };
                    window.addEventListener("test", null, options);
                    window.removeEventListener("test", null, options);
                } catch (e) { }
                return passive;
            })(),

            // DOM helper functions
            getElement: (selector) => document.querySelector(selector),
            getAllElements: (selector) => document.querySelectorAll(selector),

            // Create a toast notification
            showToast: (message, type = 'info', duration = 3000) => {
                const toast = document.getElementById('toast');
                if (!toast) return; // Avoid errors if toast element is missing
                toast.textContent = message;
                toast.className = `toast ${type} visible`;

                setTimeout(() => {
                    toast.classList.remove('visible');
                }, duration);
            },

            // Safely parse and sanitize SVG content
            sanitizeSvg: (svgContent) => {
                try {
                    // Create a new DOMParser
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(svgContent, 'image/svg+xml');

                    // Check for parsing errors
                    const errorNode = doc.querySelector('parsererror');
                    if (errorNode) {
                        console.error('Error parsing SVG:', errorNode.textContent);
                        throw new Error('Error parsing SVG');
                    }

                    // Remove potentially dangerous elements and attributes
                    const scripts = doc.querySelectorAll('script');
                    scripts.forEach(script => script.remove());

                    // Remove event handlers
                    const allElements = doc.querySelectorAll('*');
                    allElements.forEach(el => {
                        Array.from(el.attributes).forEach(attr => {
                            if (attr.name.startsWith('on') || (attr.name === 'href' && attr.value.startsWith('javascript:'))) {
                                el.removeAttribute(attr.name);
                            }
                        });
                    });

                    // Convert back to string
                    return new XMLSerializer().serializeToString(doc.documentElement);
                } catch (error) {
                    console.error('SVG sanitization error:', error);
                    return null;
                }
            },

            // Debounce function to limit function calls
            debounce: (func, wait) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }
        };

        // Theme management
        const ThemeManager = {
            currentTheme: 'dark',

            init() {
                this.themeToggle = Utils.getElement('.theme-toggle');
                this.themeIcon = Utils.getElement('.theme-icon');
                this.body = document.body;

                if (!this.themeToggle || !this.themeIcon) {
                    console.error("Theme toggle elements not found.");
                    return;
                }

                // Set initial theme from localStorage or default to dark
                const savedTheme = localStorage.getItem('theme') || 'dark';
                this.applyTheme(savedTheme);

                // Add event listener for theme toggle
                this.themeToggle.addEventListener('click', () => {
                    const newTheme = this.body.classList.contains('dark') ? 'light' : 'dark';
                    this.applyTheme(newTheme);
                }, Utils.supportsPassiveEvents ? { passive: true } : false);
            },

            applyTheme(theme) {
                this.currentTheme = theme;

                if (theme === 'dark') {
                    this.body.classList.add('dark');
                    this.themeIcon.textContent = '☀️';
                    this.themeToggle.setAttribute('aria-pressed', 'true');
                } else {
                    this.body.classList.remove('dark');
                    this.themeIcon.textContent = '🌙';
                    this.themeToggle.setAttribute('aria-pressed', 'false');
                }

                localStorage.setItem('theme', theme);

                // Update chatbot theme if it's initialized
                if (ChatbotManager.isInitialized) {
                    ChatbotManager.updateTheme(theme);
                }
            }
        };

                // Logo management
                const LogoManager = {
                    init() {
                        this.headerLogoSvg = Utils.getElement('#header-logo-svg');
                        this.headerLogo = Utils.getElement('.header-logo');

                        if (!this.headerLogoSvg || !this.headerLogo) {
                            console.error("Header logo elements not found.");
                            return;
                        }
                    }
                };


        // Icon management for chat messages
        const IconManager = {
            init() {
                this.botIconTemplate = Utils.getElement('#bot-icon-template');
                this.userIconTemplate = Utils.getElement('#user-icon-template');
                this.chatbotContainer = Utils.getElement('#chatbot-container');

                if (!this.botIconTemplate || !this.userIconTemplate || !this.chatbotContainer) {
                    console.error("Icon templates or chatbot container not found.");
                    return;
                }

                // Check for template support
                this.supportsTemplate = 'content' in document.createElement('template');
                if (!this.supportsTemplate) {
                    console.warn('Browser does not support HTML templates. Using fallback for icons.');
                }

                // Create observer for watching new messages
                this.setupObserver();
            },

            setupObserver() {
                // Create a mutation observer to watch for new messages
                this.observer = new MutationObserver(mutations => {
                    mutations.forEach(mutation => {
                        if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                            // Apply icons debounced or delayed to ensure DOM is ready
                            // Using setTimeout directly is simpler here
                            setTimeout(() => this.applyIconsToMessages(), 100);
                        }
                    });
                });
            },

            startObserving() {
                if (!this.observer || !this.chatbotContainer) return;
                // Start observing the chatbot container
                this.observer.observe(this.chatbotContainer, {
                    childList: true,
                    subtree: true,
                });

                // Initial application of icons
                this.applyIconsToMessages();
            },

            stopObserving() {
                if (this.observer) {
                    this.observer.disconnect();
                }
            },

            applyIconsToMessages() {
                if (!this.botIconTemplate || !this.userIconTemplate) return;

                // More specific selector targeting likely Flowise structure, adjust as needed
                const messages = Utils.getAllElements('.message-content:not(.icon-added)');

                messages.forEach(message => {
                    try {
                        // Determine if it's a user or bot message based on parent structure
                        const isUserMessage = message.closest('.user-message') !== null;

                        // Create icon container
                        const iconContainer = document.createElement('div');
                        iconContainer.className = isUserMessage ? 'user-icon message-icon' : 'bot-icon message-icon'; // Combine classes

                        // Create the appropriate icon
                        const iconTemplate = isUserMessage ? this.userIconTemplate : this.botIconTemplate;
                        const iconContent = document.importNode(iconTemplate.content, true);
                        iconContainer.appendChild(iconContent);

                        // Find the avatar placeholder within the Flowise message structure
                        // This selector might need adjustment based on Flowise's exact output
                        let avatarPlaceholder = message.closest('.message-container')?.querySelector('.avatar-placeholder, .message-avatar, .avatar');

                        if (avatarPlaceholder) {
                            // Replace placeholder content
                            avatarPlaceholder.innerHTML = '';
                            avatarPlaceholder.appendChild(iconContainer);
                        } else {
                            // Fallback: Prepend icon if no placeholder found
                            // This might require adjusting message layout CSS
                            message.prepend(iconContainer);
                            console.warn("Avatar placeholder not found, prepending icon to message:", message);
                        }

                        // Mark as processed
                        message.classList.add('icon-added');
                    } catch (error) {
                        console.error('Error applying icon to message:', error, message);
                        // Optionally mark as processed anyway to prevent repeated errors
                        message.classList.add('icon-added', 'icon-error');
                    }
                });
            }
        };

        // Chatbot management
        const ChatbotManager = {
            isInitialized: false,

            init() {
                this.chatbotContainer = Utils.getElement('#chatbot-container');
                this.loadingIndicator = Utils.getElement('#loading-indicator');
                this.resetButton = Utils.getElement('#reset-button');

                if (!this.chatbotContainer || !this.loadingIndicator || !this.resetButton) {
                    console.error("Chatbot UI elements not found.");
                    return;
                }

                // Add event listener for reset button
                // this.resetButton.addEventListener('click', () => this.resetChat(),
                //     Utils.supportsPassiveEvents ? { passive: true } : false);
            },

            async initializeFlowise() {
                if (!this.chatbotContainer || !this.loadingIndicator) return;
                // Show loading indicator
                this.loadingIndicator.style.display = 'flex';

                try {
                    // Ensure container is empty before adding
                    this.chatbotContainer.innerHTML = ''; // Clear previous errors/content
                    this.chatbotContainer.appendChild(this.loadingIndicator); // Re-add loading indicator

                    // Create the Flowise element
                    const flowiseElement = document.createElement('flowise-fullchatbot');
                    // Append after loading indicator, or replace indicator later
                    this.chatbotContainer.appendChild(flowiseElement);

                    // Initialize Flowise with the module import approach
                    const module = await import("https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js");
                    const Chatbot = module.default;

                    Chatbot.initFull({
                        chatflowid: "588be9ca-939a-4c4d-b3c4-de606c53c37a",
                        apiHost: "https://flowise.pyragogy.org",
                        theme: this.getThemeConfig()
                    });

                    // Hide loading indicator
                    this.loadingIndicator.style.display = 'none';

                    // Show reset button
                    this.resetButton.classList.add('visible');

                    // Start observing for message icons
                    IconManager.startObserving();

                    // Mark as initialized
                    this.isInitialized = true;

                    // Show success message
                    Utils.showToast('Chatbot initialized successfully', 'success');
                } catch (error) {
                    console.error("Error loading Flowise:", error);
                    this.loadingIndicator.style.display = 'none';
                    // Display error message within the container
                    this.chatbotContainer.innerHTML = `
                        <div style="color: #ef4444; text-align: center; padding: 20px; margin: auto;">
                            <p>Error initializing chatbot. Please try refreshing the page.</p>
                            <p style="font-size: 0.8em; margin-top: 10px;">${error.message}</p>
                            <button id="retry-button" style="margin-top: 15px; padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Retry Initialization
                            </button>
                        </div>
                    `;

                    // Add retry button functionality
                    const retryButton = Utils.getElement('#retry-button');
                    if (retryButton) {
                        retryButton.addEventListener('click', () => {
                            // No need to manually re-add loading indicator here, initializeFlowise handles it
                            this.initializeFlowise();
                        }, { once: true }); // Use once to prevent multiple bindings
                    }

                    // Show error toast
                    Utils.showToast(`Chatbot initialization failed`, 'error');
                }
            },

            getThemeConfig() {
                const isDark = ThemeManager.currentTheme === 'dark';
                const fontSize = '16px';

                return {
                    chatWindow: {
                        backgroundColor: isDark ? 'var(--background-dark)' : 'var(--background-light)',
                        textColor: isDark ? 'var(--text-dark)' : 'var(--text-light)',
                        fontSize: fontSize,
                        // Ensure height/width are handled by the container, not Flowise theme
                    },
                    chatMessage: {
                        backgroundColor: isDark ? '#1f2937' : '#ffffff', // Slightly different from main bg
                        textColor: isDark ? 'var(--text-dark)' : 'var(--text-light)',
                        fontSize: fontSize,
                    },
                    userMessage: {
                        backgroundColor: 'var(--primary)',
                        textColor: '#ffffff',
                        fontSize: fontSize,
                    },
                    userInput: {
                        backgroundColor: isDark ? '#1f2937' : '#ffffff',
                        textColor: isDark ? 'var(--text-dark)' : 'var(--text-light)',
                        placeholderColor: isDark ? '#9ca3af' : '#6b7280',
                        fontSize: fontSize,
                    },
                    // Add other theme options if needed by Flowise
                };
            },

            updateTheme(theme) {
                // Flowise embed doesn't support dynamic theme updates via a method.
                // Re-initialization is the only way, but can be disruptive (clears chat).
                console.warn("Dynamic theme update requires re-initializing the chatbot.");
                // Optional: Implement re-initialization if essential, maybe with a warning.
                // this.resetChat(false); // Pass flag to avoid confirmation?
            },

            resetChat(confirmReset = true) { // Add optional confirmation flag
                if (!this.chatbotContainer || !this.resetButton) return;

                const performReset = () => {
                    // Stop observing old DOM
                    IconManager.stopObserving();

                    // Clear container (will be repopulated by initializeFlowise)
                    this.chatbotContainer.innerHTML = '';
                    this.isInitialized = false; // Mark as not initialized

                    // Hide reset button until reinitialized
                    this.resetButton.classList.remove('visible');

                    // Reinitialize Flowise (will show loading indicator)
                    this.initializeFlowise();

                    // Show success message
                    Utils.showToast('Chat has been reset', 'info');
                };

                if (confirmReset) {
                    if (confirm("Are you sure you want to reset the chat? This will clear your conversation history.")) {
                        performReset();
                    }
                } else {
                    performReset(); // Reset without confirmation
                }
            }
        };

        // UI management
        const UIManager = {
            init() {
                this.welcomeScreen = Utils.getElement('.welcome-screen');
                this.chatbotContainer = Utils.getElement('#chatbot-container');
                this.startButton = Utils.getElement('.cta-button');
                this.coffeeButton = Utils.getElement('.coffee-button');
                this.coffeeClose = Utils.getElement('.coffee-close');
                this.coffeeMessageElement = this.coffeeButton?.querySelector('.message'); // Use optional chaining

                if (!this.welcomeScreen || !this.chatbotContainer || !this.startButton || !this.coffeeButton || !this.coffeeClose) {
                    console.error("Core UI elements not found.");
                    return;
                }

                // Add event listeners
                this.startButton.addEventListener('click', () => this.startChatbot(),
                    Utils.supportsPassiveEvents ? { passive: true } : false);

                // Coffee button close logic
                this.setupCoffeeButton();

                // Set initial coffee button message (if element exists)
                if (this.coffeeMessageElement) {
                    this.setCoffeeMessage();
                }

                // Add keyboard navigation support
                this.setupKeyboardNavigation();
            },

            startChatbot() {
                console.log("Start Exploration clicked.");
                this.welcomeScreen.classList.add('hidden');
                this.chatbotContainer.classList.add('visible');
                // Initialize Flowise only when the button is clicked
                if (!ChatbotManager.isInitialized) {
                    ChatbotManager.initializeFlowise();
                }
            },

            setCoffeeMessage() {
                if (!this.coffeeMessageElement) return;
                const messages = [
                    "Fuel the co-creation ☕",
                    "Spark a peer! 🚀",
                    "Support the handbook evolution"
                ];
                // This message is hidden by CSS, but set it anyway in case CSS changes
                this.coffeeMessageElement.textContent = messages[Math.floor(Math.random() * messages.length)];
            },

            setupCoffeeButton() {
                const COFFEE_CLOSED_TIME_KEY = 'coffeeClosedTime';
                const HIDE_DURATION = 7 * 24 * 60 * 60 * 1000; // 7 days

                // Check if it should be hidden based on localStorage
                const closedTimestamp = localStorage.getItem(COFFEE_CLOSED_TIME_KEY);
                if (closedTimestamp && (Date.now() - parseInt(closedTimestamp)) < HIDE_DURATION) {
                    this.coffeeButton.style.display = 'none';
                } else {
                    // Time expired, show button
                    localStorage.removeItem(COFFEE_CLOSED_TIME_KEY);
                    this.coffeeButton.style.display = ''; // Reset display
                }

                // Add close listener
                this.coffeeClose.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent potential parent clicks
                    this.coffeeButton.style.display = 'none';
                    localStorage.setItem(COFFEE_CLOSED_TIME_KEY, Date.now().toString());
                }, Utils.supportsPassiveEvents ? { passive: false } : false); // Passive false needed for stopPropagation? Check necessity.
            },

            setupKeyboardNavigation() {
                // Add keyboard navigation for important elements
                document.addEventListener('keydown', (e) => {
                    // Escape key closes modals or resets focus
                    if (e.key === 'Escape') {
                        // Close coffee button if visible and not already closing
                        if (this.coffeeButton.style.display !== 'none') {
                            // Trigger click on close button for consistency with storage logic
                            this.coffeeClose.click();
                            e.preventDefault(); // Prevent other escape actions
                        }
                        // Add other Escape key actions if needed (e.g., close modals)
                    }
                });

                // Ensure focus styles work (already handled by CSS)
            }
        };

        // Main application initialization
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize all managers
            ThemeManager.init();
            LogoManager.init();
            IconManager.init(); // Init IconManager but don't start observing yet
            ChatbotManager.init();
            UIManager.init();

            // Performance: Lazy load non-critical resources (Example, if needed)
            // Currently no images marked for lazy loading, but keep pattern if added
            /*
            if ('IntersectionObserver' in window) {
                const lazyImages = Utils.getAllElements('img[loading="lazy"]');
                const imageObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            if (img.dataset.src) {
                                img.src = img.dataset.src;
                                img.removeAttribute('loading'); // Optional: remove attribute
                                observer.unobserve(img);
                            }
                        }
                    });
                });
                lazyImages.forEach(img => imageObserver.observe(img));
            }
            */

            // Clean up resources when page is unloaded
            window.addEventListener('beforeunload', () => {
                IconManager.stopObserving(); // Stop observer and interval
            });

            // Add any other post-load initializations here
        });
    </script>
