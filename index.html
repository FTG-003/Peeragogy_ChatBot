<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Viewport tag è già corretto -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeeragogyBot – Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" as="image"
        href="https://raw.githubusercontent.com/FTG-003/PeeragogyBot-Flowise/chatbot_deploy/peeragogy-bot/ChatBOT-V1.1.9/assets/images/peeragogybot-avatar-white.svg">
    <style>
        :root {
            --primary-glow: #6366f1;
            --secondary-glow: #3b82f6;
            --tertiary-glow: #8b5cf6;
            --text-light: #f0f0f0;
            --text-heading: #ffffff;
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --button-bg: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            --button-hover-bg: linear-gradient(135deg, var(--secondary-glow), var(--tertiary-glow));
            --bg-dark: #0a0a10;
            --font-family: 'Inter', sans-serif;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.7;
             /* Considerare di ridurre l'opacità o il numero di particelle (via JS) su mobile se le performance sono basse */
        }

        #activation-gate {
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Rimosso padding globale, applicato a .gate-content */
            box-sizing: border-box;
            background: rgba(10, 10, 15, 0.3);
            backdrop-filter: blur(5px); /* Monitorare performance su mobile */
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease-out, visibility 0s linear 0s;
        }

        #activation-gate.hidden {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in, visibility 0s linear 0.8s;
        }

        .gate-content {
            background: var(--glass-bg);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-radius: 24px;
            /* Padding originale per Desktop */
            padding: 50px 60px;
            width: 90%; /* Già responsive */
            max-width: 720px; /* Già responsive */
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: scale(0.95);
            opacity: 0;
            animation: gate-enter 0.8s 0.2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            box-sizing: border-box; /* Aggiunto per sicurezza con padding */
        }

        @keyframes gate-enter {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .gate-logo-container {
            margin-bottom: 35px; /* Potrebbe essere ridotto su mobile */
            transform: translateZ(0);
        }

        #gate-logo {
            width: 180px; /* Potrebbe essere ridotto su mobile */
            height: auto;
            filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5));
            animation: subtle-float 7s ease-in-out infinite;
        }

        @keyframes subtle-float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-12px) scale(1.03); }
            100% { transform: translateY(0); }
        }

        .gate-content h1 {
            /* Font size originale per Desktop */
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .gate-content p {
             /* Font size originale per Desktop */
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 550px;
            margin-bottom: 2.5rem; /* Potrebbe essere ridotto su mobile */
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        #activate-button {
             /* Padding/Font size originale per Desktop */
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            font-weight: 600;
            color: white;
            background: var(--button-bg);
            background-size: 200% 200%;
            transition: all 0.4s ease;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
            letter-spacing: 0.5px;
            white-space: nowrap; /* Impedisce al testo del bottone di andare a capo */
        }

        #activate-button:hover { /* Effetto hover meno rilevante su mobile */
            background-position: 100% 0;
            background: var(--button-hover-bg);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
            transform: translateY(-3px);
        }

        flowise-fullchatbot {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in, visibility 0s linear 0.8s;
        }

        flowise-fullchatbot.visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease-out, visibility 0s linear 0s;
        }

        /* --- INIZIO MODIFICHE MOBILE FRIENDLY --- */
        @media (max-width: 768px) { /* Applica a tablet e telefoni */
            .gate-content {
                /* Riduci padding per schermi più piccoli */
                padding: 30px 25px; /* Verticale | Orizzontale */
                 max-width: 95%; /* Opzionale: permette al box di essere leggermente più largo */
            }

             .gate-logo-container {
                margin-bottom: 25px; /* Riduci spazio sotto il logo */
             }

             #gate-logo {
                width: 140px; /* Riduci dimensione logo */
             }

             .gate-content h1 {
                 /* Riduci dimensione font titolo */
                 font-size: 1.8rem; /* ~29px */
                 margin-bottom: 0.8rem;
             }

             .gate-content p {
                 /* Riduci leggermente dimensione font paragrafo */
                 font-size: 1rem; /* 16px */
                 margin-bottom: 2rem; /* Riduci spazio sotto il paragrafo */
             }

             #activate-button {
                 /* Riduci padding e font size bottone */
                 padding: 0.8rem 1.8rem;
                 font-size: 1rem; /* 16px */
             }
        }

        @media (max-width: 480px) { /* Ulteriori aggiustamenti per schermi molto piccoli */
             .gate-content h1 {
                 font-size: 1.6rem; /* ~25.6px */
             }
              .gate-content p {
                 font-size: 0.95rem; /* ~15px */
             }
              #activate-button {
                 padding: 0.7rem 1.5rem;
                 font-size: 0.95rem;
             }
             #gate-logo {
                width: 120px; /* Ancora più piccolo */
             }
        }
        /* --- FINE MODIFICHE MOBILE FRIENDLY --- */

    </style>
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div id="activation-gate">
        <div class="gate-content">
            <div class="gate-logo-container">
                <img src="https://raw.githubusercontent.com/FTG-003/Peeragogy_ChatBot/refs/heads/deploy-setup/assets/images/peeragogy.svg"
                    alt="Peeragogy Logo" id="gate-logo" />
            </div>
            <h1>Peeragogy Handbook – AI Edition</h1>
            <p><i>“I’m PeeragogyBot: trained on 5,083 entries from the core Peeragogy text. 2,541,500 characters of
                    distilled co-learning, ready to spark with you.”</i></p>
            <button id="activate-button" aria-label="Activate PeeragogyBot">Start Exploration ✨</button>
        </div>
    </div>

    <flowise-fullchatbot id="peeragogy-bot"></flowise-fullchatbot>

    <script type="module">
        (async function () {
            // Il codice JS rimane invariato, gestisce la logica.
            // Le modifiche sono solo nel CSS per l'aspetto.
            const { default: Chatbot } = await import("https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js");

            const activationGate = document.getElementById("activation-gate");
            const activateButton = document.getElementById("activate-button");
            const chatbotElement = document.getElementById("peeragogy-bot");

            let isChatbotInitialized = false;

            activateButton.addEventListener("click", async () => {
                activationGate.classList.add("hidden");
                chatbotElement.classList.add("visible");

                if (!isChatbotInitialized) {
                    isChatbotInitialized = true;
                    // La configurazione di initFull rimane la stessa
                    Chatbot.initFull({
                        chatflowid: "d5f669ab-e063-4302-bea8-8ea55335603b",
                        apiHost: "https://peeragogybot-flowise-production-68ec.up.railway.app",
                        chatflowConfig: {},
                        theme: { // Il tema interno del chatbot rimane lo stesso
                            chatWindow: {
                                showTitle: true,
                                title: "PeeragogyBot Nexus",
                                titleAvatarSrc: "https://raw.githubusercontent.com/FTG-003/Peeragogy_ChatBot/refs/heads/deploy-setup/assets/images/avatars/peeragogybot-avatar-black.svg",
                                welcomeMessage: "Connection complete. Co-creation mode activated!",
                                backgroundColor: "#10121a",
                                height: "100%", // Corretto per full page
                                width: "100%",  // Corretto per full page
                                fontSize: 16,
                                botMessage: {
                                    backgroundColor: "#2a2f3d",
                                    textColor: "#e0e0e0",
                                    showAvatar: true,
                                    avatarSrc: "https://raw.githubusercontent.com/FTG-003/Peeragogy_ChatBot/refs/heads/deploy-setup/assets/images/avatars/logo.svg"
                                },
                                userMessage: {
                                    backgroundColor: "var(--secondary-glow)", // Usa la variabile CSS globale
                                    textColor: "#ffffff",
                                    showAvatar: true,
                                    avatarSrc: "https://raw.githubusercontent.com/zahidkhawaja/langchain-chat-nextjs/main/public/usericon.png"
                                },
                                textInput: {
                                    placeholder: "Send a thought impulse...",
                                    backgroundColor: "#1a1d29",
                                    textColor: "#e0e0e0",
                                    sendButtonColor: "var(--primary-glow)", // Usa la variabile CSS globale
                                    autoFocus: true
                                },
                                footer: {
                                    textColor: "#a0a0a0",
                                    text: "π Nexus – v1.1.8",
                                    company: "Co-created by Fabrizio Terzi + OpenAI",
                                    companyLink: "https://github.com/FTG-003"
                                }
                            }
                        }
                    });
                }
            });

             // Il codice dell'animazione delle particelle rimane invariato
             const canvas = document.getElementById('particle-canvas');
             if (canvas) {
                 const ctx = canvas.getContext('2d');
                 canvas.width = window.innerWidth;
                 canvas.height = window.innerHeight;
                 const particles = [];
                 // Potresti considerare di ridurre particleCount su schermi piccoli qui nel JS,
                 // ma richiede logica aggiuntiva per rilevare la dimensione schermo.
                 // Lasciamo 100 per ora.
                 const particleCount = 100;
                 for (let i = 0; i < particleCount; i++) {
                     particles.push({
                         x: Math.random() * canvas.width,
                         y: Math.random() * canvas.height,
                         radius: Math.random() * 2 + 1,
                         color: `rgba(${Math.floor(Math.random() * 100 + 150)}, ${Math.floor(Math.random() * 100 + 150)}, ${Math.floor(Math.random() * 150 + 100)}, ${Math.random() * 0.5 + 0.3})`,
                         velocity: {
                             x: (Math.random() - 0.5) * 0.5,
                             y: (Math.random() - 0.5) * 0.5
                         }
                     });
                 }
                 function animate() {
                     requestAnimationFrame(animate);
                     ctx.clearRect(0, 0, canvas.width, canvas.height);
                     particles.forEach(particle => {
                         particle.x += particle.velocity.x;
                         particle.y += particle.velocity.y;
                         if (particle.x < 0) particle.x = canvas.width;
                         if (particle.x > canvas.width) particle.x = 0;
                         if (particle.y < 0) particle.y = canvas.height;
                         if (particle.y > canvas.height) particle.y = 0;
                         ctx.beginPath();
                         ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                         ctx.fillStyle = particle.color;
                         ctx.fill();
                     });
                 }
                 window.addEventListener('resize', () => {
                     canvas.width = window.innerWidth;
                     canvas.height = window.innerHeight;
                     // Potresti dover rigenerare le particelle o ricalcolare le posizioni qui
                     // se il resize causa problemi visivi, ma per ora va bene.
                 });
                 animate();
             }
        })();
    </script>
</body>

</html>
